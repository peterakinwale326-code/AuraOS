[package]
name = "auraos-kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
bootloader = "0.9.23"
linked_list_allocator = "0.10.5"
x86_64 = "0.15.2"

[[bin]]
name = "auraos-kernel"
path = "src/main.rs"
test = false
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1

[package.metadata.bootimage]
run-args = ["-serial", "stdio"]
